# Ablation study — GPU 5 half: the three ARCHITECTURAL arms.
# Each removes a distinct structural component of the method.
#   point_estimate_leaf  single posterior-blended head instead of the Bayes
#                        average over the regime family (leaf evaluation)
#   joint_selection      joint team-UCB child selection instead of the
#                        vectorized decoupled per-agent selection (search rule)
#   no_subjective        plain MAZero — no belief / hypernet / subjective heads
#                        (the whole subjective pathway; cooperative-sanity arm).
#                        VERIFIED: no belief_net -> predict_rewards() returns
#                        None, so fidelity.json is intentionally NOT written.
#
# The conditioning-mechanism arms (moe_router / film) run on GPU 6 — they are a
# matched pairwise comparison and are kept on one card so they share hardware
# conditions. The unablated reference is the mazero_mixed row in
# compare_gpu3.yaml; do not duplicate it here.
#
# 3 arms x 1 env x 3 seeds = 9 runs at ~6 h ~= 2.3 days.
algos:
  - mazero_mixed
ablations:
  - point_estimate_leaf
  - joint_selection
  - no_subjective
envs:
  - relation
seeds: [0, 1, 2]
total_env_steps: 200000
episodes: 16
num_pmcts: 1
