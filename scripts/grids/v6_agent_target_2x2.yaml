# v6 action-axis (per-agent marginal) policy target -- 2x2, 2 seeds, 8 runs.
#
# NOT LAUNCHED. Registered so the wave is one command away; the GPU spend is
# the user's call.
#
# The question
# ------------
# Does aggregating the root's children onto per-agent action slots by a
# visit-weighted AVERAGE inside the exponent (agent_q_softmax) beat the SUM of
# exp outside it (q_softmax), and does it specifically repair root_cover=star?
#
#   arm                                         root_cover  policy_target
#   ..._qtarget                (already run)    none        q_softmax
#   ..._mctsfix                (already run)    star        q_softmax
#   ..._agentq                 (new)            none        agent_q_softmax
#   ..._agentq_cover           (new)            star        agent_q_softmax
#
# STATUS 2026-08-08: the 8 agentq runs (2 arms x seeds 0-3) are LAUNCHED on
# GPUs 0-7. The q_softmax row is NOT yet matched -- it exists only at seeds 0-1
# in results_v6_2x2/, from a different session.
#
# REMAINING FOLLOW-UP, in priority order:
#   1. Re-run qtarget + mctsfix at seeds 0-3 IN ONE SESSION (8 runs) once GPUs
#      free. That gives a fully matched n=4 2x2 and removes the cross-session
#      reproducibility floor (v6_reporting_protocol.md: archived g4 100.905
#      re-runs at 96.969 through the identical code path).
#   2. Until then, any agentq-vs-q_softmax difference is BOTH cross-session and
#      unbalanced (n=4 vs n=2). Treat ~4-point gaps as potentially artefactual
#      and do not headline them.
#
# Ordering rationale: seed noise dominates session drift here (star/q_softmax
# spread ~13-19 vs a few points of drift), so buying seeds on the NEW arms
# first is worth more than matched pairs at n=2.
#
# Why the star cell is the discriminating one
# -------------------------------------------
# Measured with scripts/probes/agent_target_probe.py (seed 0, 8 eps/regime):
#
#   arm            children  vis/child  distinct  max mult  mass_q  mass_agent    TV
#   none/q_softmax     4.0       6.25      3.14      1.90   0.466       0.364  0.108
#   star/q_softmax    11.2       2.22      6.00      6.00   0.567       0.228  0.340
#
# The star cover enumerates each agent's actions against a CRN anchor drawn
# from every OTHER agent's noised prior (cnode.cpp:341-365), so it pins each
# agent at ONE prior draw across exactly A = 6 of its ~11.2 children. Because
# q_softmax sums exp-terms, that single draw collects 0.567 of the agent's
# target mass; agent_q_softmax gives it 0.228. So star -- built to break prior
# self-reinforcement -- re-injects each agent's own prior at A-fold
# multiplicity, and q_softmax amplifies it.
#
# That predicts the measured g1 NashConv seed-spread rank order:
#   none/visit 0.21 < none/q_softmax 1.06 < star/visit 8.03 < star/q_softmax 18.98
#
# PRE-REGISTERED READ. The wave is informative either way:
#   * If agentq_cover collapses the star seed spread toward the none cells,
#     the multiplicity account is supported.
#   * If it does not, the account is FALSIFIED and the visits-per-child budget
#     explanation (2.22/child under star vs 6.25 under none) survives instead.
# Do not reinterpret after the fact.
#
# tau = 0.85 on both agent cells: the measured span ratio is 0.891 (none) and
# 0.800 (star), and averaging within a collision group shrinks the advantage
# span, so inheriting tau=1.0 would compare "per-agent marginalization" against
# "a flatter target". Held EQUAL across the two agent cells so root_cover stays
# the only factor between them.
#
# Scoring (results/analysis/v6_reporting_protocol.md -- return_mean is NOT the
# headline; it is structurally blind in 3 of 5 regimes):
#   g0, g4 -> team return           eval_report.json:return_per_regime
#   g2, g3 -> PER-AGENT return      eval_diagnostics.json
#   g1     -> NashConv ONLY         scripts/eval_game_metrics.py --br-steps 20000
# Select on the last-20% of each run's own periodic eval, not the final
# checkpoint (single-point sd ~ 8-12).
#
# LAUNCH -- READ THIS, THE OBVIOUS FORM IS WRONG
#
# This file is the experiment RECORD. Do NOT launch it with
# `launch_grid.sh ... --ablation X --seed N`: `_run_grid` resolves the grid as
#
#     ablations = spec.get("ablations") or [args.ablation]
#     seeds     = spec.get("seeds")     or [args.seed]
#
# (scripts/train.py:346-353) -- the yaml's lists WIN, so a CLI --ablation or
# --seed alongside --grid is silently IGNORED. That command would run all four
# rows SEQUENTIALLY on one GPU (~48 h), not the one row it looks like.
#
# Launch one tmux session per (arm, seed) calling train.py DIRECTLY -- which is
# what the wave-1 2x2 and the blend sweep actually did (their logs carry no
# "[train.py grid]" line). 4 runs, ~12 h each, sharing one --out because each
# (arm, seed) resolves to a distinct run_dir:
#
#   PY=/home/zhengwenbo/.conda/envs/lightzero/bin/python
#   tmux new-session -d -s v6aq_agentq_s0 \
#     "$PY scripts/train.py --algo mazero_mixed --env relation_recip --seed 0 \
#        --total-env-steps 1000000 --episodes 128 --lr 0.02 --num-pmcts 16 \
#        --ablation ref_bc_anneal_scaled_hardval_decoupled_agentq \
#        --gpus 3 --out results_v6_agentq/ 2>&1 | tee results/_logs/v6aq_agentq_s0.log"
#
# ...and the same for (agentq, seed 1), (agentq_cover, seed 0),
# (agentq_cover, seed 1) on their own GPUs.
#
# GPUs 0-8 are allowed (ALLOWED_GPUS in scripts/train.py); 9 is another user's.
#
# If you DO want launch_grid.sh, split this into one yaml per (arm, seed) --
# the launcher always passes --grid, so there is no override path.

algos: [mazero_mixed]
envs: [relation_recip]
ablations:
  - ref_bc_anneal_scaled_hardval_decoupled_agentq
  - ref_bc_anneal_scaled_hardval_decoupled_agentq_cover
# n=4, NOT the n=2 the previous waves used. star/q_softmax's measured seed
# spread is 18.98 on g1 NashConv and ~13 on return -- LARGER than the effects
# under test -- so n=2 cannot resolve the star comparison this wave exists for.
# Every prior v6 conclusion carries an explicit "everything is n=2" caveat;
# this is the first wave that does not.
seeds: [0, 1, 2, 3]
total_env_steps: 1000000
lr: 0.02
episodes: 128
num_pmcts: 16
