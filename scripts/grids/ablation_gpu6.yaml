# Ablation study — GPU 6, part 1: one of the two CONDITIONING-MECHANISM arms.
#
# moe_router / film swap how theta is generated for the DualHyperNetwork while
# feeding it the SAME ctx input — this is the controlled Direction-1 mechanism
# comparison, and it is read as a PAIR against each other and against the
# unablated hypernet. They are deliberately kept on one card so both arms see
# identical hardware conditions — 2026-07-20: as two CONCURRENT sessions
# (ablation_gpu6.yaml / ablation_gpu6b.yaml) rather than one sequential
# session, since two programs per GPU are confirmed to coexist without a
# meaningful slowdown; still the same card, so the "identical hardware"
# framing holds.
#
# (Distinct from the m3w_adapted BASELINE, which is a different training
# paradigm entirely, not a mechanism swap.)
#
# seed 0 only for now (quick full pass across every algo/arm/env first);
# seeds 1-2 are backfilled as a follow-up, not dropped.
algos:
  - mazero_mixed
ablations:
  - moe_router
envs:
  - relation
seeds: [0]
total_env_steps: 200000
episodes: 16
num_pmcts: 1
