# Comparative experiments — GPU 4, part 1: the four env-portable baselines
# across all three envs. 4 algos x 3 envs x 3 seeds = 36 runs, all far cheaper
# than a mazero_mixed row (no MCTS).
#
# VERIFIED: all four run on mpe_tag (N=4) at tiny budget.
# mbom / mbom_oracle are NOT here — they are duo-only; see compare_gpu4_duo.yaml.
algos:
  - mappo
  - mamba
  - happo
  - m3w_adapted
envs:
  - relation
  - relation_holdout
  - mpe_tag
seeds: [0, 1, 2]
total_env_steps: 200000
episodes: 16
num_pmcts: 1
