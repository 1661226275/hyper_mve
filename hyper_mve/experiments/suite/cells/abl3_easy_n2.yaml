# 消融3 Easy N=2 对照 (Ch6.6 / 决策点 1 核心实验, 断言 A).
# 3 composition points on Easy N=2: 1α1β / 2α0β / 0α2β. Hyper vs MA-MuZero.
# 2 variants × 3 seeds × 3 points = 18 runs. The 生死判官 gate runs HERE first.
meta:
  id: abl3_easy_n2
  title: "消融3 Easy N=2 对照 — 类型异质性 (断言 A, 决策点 1)"
  tier: must_have
  size: easy
  deliverables: ["Table 6.4 (Easy gate)", "Fig 6.4 (Easy)"]
  assertion: "A — 1α1β 处 Hyper 显著优于 MA-MuZero; 同质场景无显著差距"
  runs_subdir: abl3_easy_n2
  blocked_on: []
variants:
  - hyper
  - baseline_ma_muzero
seeds: [0, 1, 2]
preset: easy
overrides:
  - {env.N: 2, env.type_assignment: [0, 1]}   # 1α1β (异质 — 预期 Hyper 占优)
  - {env.N: 2, env.type_assignment: [0, 0]}   # 2α0β (同质 — 预期无差距)
  - {env.N: 2, env.type_assignment: [1, 1]}   # 0α2β (同质 — 预期无差距)
max_steps: 200000
eval_planner_mode: planner_full
max_parallel: 2
n_gpus: 2
ablation_cell_id: abl3_easy_n2
