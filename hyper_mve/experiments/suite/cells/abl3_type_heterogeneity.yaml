# 消融3 — 类型异质性扫描钟形曲线 (Ch6.6 / 决策点 1, 断言 A — 生死判官).
# Hyper vs 共享-RewardHead MA-MuZero across the ρ_β grid; ONE run per type ratio
# (the bell-curve x-axis). ALPHA=0, BETA=1; the sweep worker converts
# env.type_assignment lists to AgentType via train_main.apply_overrides.
# 2 variants × 5 seeds × 5 ratios = 50 rows. Bell curve assembled one-run-per-
# ratio (unified_evaluator leaves return_per_type_ratio at 0; see plan).
meta:
  id: abl3_type_heterogeneity
  title: "消融3 — 类型异质性扫描钟形曲线 (断言 A)"
  tier: must_have
  size: medium
  deliverables: ["Table 6.4", "Fig 6.4"]
  assertion: "A — 类型梯度撕裂: 共享 RewardHead 在 50/50 处显著劣于 per-agent θ_rew"
  runs_subdir: abl3_type_het
  blocked_on: []
  notes: "1α+3β type-id 绑定对照点可后续加为第 6 个 override; bell curve 按 β 数目对齐."
variants:
  - hyper
  - baseline_ma_muzero   # 共享 RewardHead 对照
seeds: [0, 1, 2, 3, 4]
preset: medium
overrides:
  - {env.N: 4, env.type_assignment: [0, 0, 0, 0]}   # ρ_β = 0/4 (4α)
  - {env.N: 4, env.type_assignment: [0, 0, 0, 1]}   # ρ_β = 1/4 (3α1β)
  - {env.N: 4, env.type_assignment: [0, 0, 1, 1]}   # ρ_β = 2/4 (2α2β) — peak
  - {env.N: 4, env.type_assignment: [0, 1, 1, 1]}   # ρ_β = 3/4 (1α3β)
  - {env.N: 4, env.type_assignment: [1, 1, 1, 1]}   # ρ_β = 4/4 (4β)
max_steps: 1000000
eval_planner_mode: planner_full
max_parallel: 2
n_gpus: 2
ablation_cell_id: abl3_type_heterogeneity
