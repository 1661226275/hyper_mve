# 消融1 Easy 门 (Ch6.4 / 决策点 2, 断言 B′) — Easy N=2, 3 seeds.
# 4 variants {Shared(MA-MuZero) / Input-Wide / Input-Deep / Hyper} × 3 seeds = 12 runs.
# Medium Abl1 (条件化谱 + 7 泛化网格) stays the in-place ../ablations/abl1_gen_scope.yaml.
meta:
  id: abl1_easy
  title: "消融1 Easy 门 — 条件化谱初步 (断言 B′, 决策点 2)"
  tier: must_have
  size: easy
  deliverables: ["Table 6.2 (Easy gate)"]
  assertion: "B′ — Hyper > max(Input-Wide, Input-Deep) on Easy"
  runs_subdir: abl1_easy
  blocked_on: []
variants:
  - hyper
  - baseline_input_wide
  - baseline_input_deep
  - baseline_ma_muzero    # "Shared" 共享 RewardHead
seeds: [0, 1, 2]
preset: easy
max_steps: 200000
eval_planner_mode: planner_full
max_parallel: 2
n_gpus: 2
ablation_cell_id: abl1_easy
