# Thesis experiment suite manifest (pkg-08+ / Ch6 + Roadmap).
#
# Lists every cell in DECISION-GATE order. Paths resolve relative to THIS file's
# directory (experiments/suite/), so they point at both the new cells/*.yaml and
# the in-place ../ablations/*.yaml. `run_suite --list` prints status; `run_suite
# --only <id>` runs a subset; cheap Easy gates precede the expensive Medium runs.
#
# tiers: must_have (必保) / degradable (可降级, 3 seeds) / cuttable (可砍, supplementary)
#
# NOTE: keep each entry a bare path on its own line — do NOT append an inline
# "# comment" after the path (a `path#comment` with no leading space folds the
# comment into the string). Use full-line comments like these for grouping.
cells:
  # 决策门 0: gen_scope 选型 (先于决策点 1 固定 Hyper 形态)
  - cells/lora_duo_film.yaml
  - cells/lora_duo_film_fc2.yaml
  - cells/lora_duo_base.yaml
  - cells/lora_medium_film.yaml
  - cells/lora_medium_film_fc2.yaml
  - cells/lora_medium_base.yaml

  # 决策点 1 (生死判官) + 决策点 2: Easy gates
  - cells/abl3_easy_n2.yaml
  - cells/abl1_easy.yaml
  - cells/zero_shot_easy.yaml
  - cells/main_comparison_easy.yaml

  # Medium headlines
  - cells/abl3_type_heterogeneity.yaml
  - ../ablations/abl1_gen_scope.yaml
  - cells/zero_shot_generalization.yaml
  - cells/main_comparison.yaml

  # 其余消融
  - ../ablations/abl4_crn_joint.yaml
  - ../ablations/abl4_joint_easy_n2.yaml
  - ../ablations/abl6_fehr_schmidt.yaml
  - ../ablations/abl7_curriculum.yaml

  # BLOCKED / supplementary
  - cells/abl2_context_paths.yaml
  - cells/lr_sweep.yaml
