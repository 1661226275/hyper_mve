# Thesis experiment suite manifest (v5 Pkg-09 / Ch6).
#
# Lists every cell in DECISION-GATE order. Paths resolve relative to THIS file's
# directory (experiments/suite/). `run_suite --list` prints status; `run_suite
# --only <id>` runs a subset.
#
# tiers: must_have (必保) / degradable (可降级, 3 seeds) / cuttable (可砍, supplementary)
#
# v5 (Pkg-09): the suite is rebuilt around the RelationCommons regime design.
# The v4 cells (lora_* gen_scope gates, abl*, main_comparison*, zero_shot_*)
# belong to the retired resource_commons/c_t design; their YAML files are
# removed in the Stage-6 cleanup and their results are non-comparable.
#
# NOTE: keep each entry a bare path on its own line — do NOT append an inline
# "# comment" after the path (a `path#comment` with no leading space folds the
# comment into the string). Use full-line comments like these for grouping.
cells:
  # 决策点 1 (生死判官): mixed hidden-regime gate — hyper vs baselines
  - cells/rel_gate_duo.yaml

  # 决策点 2: zero-shot regime holdout (线性值分解 thesis hook)
  - cells/rel_zero_shot_duo.yaml
