# pkg-08 spec 06 §3.2 — Abl4 CRN x CoordDesc 2x2 main matrix (Medium).
# 1 variant x 5 seeds x 4 cells = 20 rows.
# Training-time axes: cfg.train.use_crn x cfg.train.randomize_order.
# Eval-time uniformly planner_full per spec 03 Lock 1.
# Backs Theory Audit §M8 + §Q2 + DESIGN_DOC_FINAL.md §4.1 + §5.8.
meta:
  id: abl4_crn_joint
  title: "消融4 — CRN × CoordDesc 2×2 主矩阵 (断言 D)"
  tier: degradable
  size: medium
  deliverables: ["Table 6.5"]
  assertion: "D — 规划器双重技术（CRN × 坐标下降）不可分割"
  runs_subdir: abl4_crn_joint
  blocked_on: []
variants:
  - hyper
seeds: [0, 1, 2, 3, 4]
preset: medium
overrides:
  - {train.use_crn: true,  train.randomize_order: true}    # baseline
  - {train.use_crn: false, train.randomize_order: true}    # CRN ablated
  - {train.use_crn: true,  train.randomize_order: false}   # CoordDesc ablated
  - {train.use_crn: false, train.randomize_order: false}   # both ablated
max_steps: 200000
eval_planner_mode: planner_full
max_parallel: 2
n_gpus: 2
ablation_cell_id: abl4_crn_joint
